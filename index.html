<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giáo dục công dân tổ 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-toolbar">
<div class="brand"><span class="brand-dot"></span><span class="brand-title">BÀI THUYẾT TRÌNH GDCD • 20 SLIDES</span></div>
<div class="toolbar-controls">
<button id="prevBtn" class="btn btn-outline" type="button">&#8592; Trước</button>
<span id="slideCounter" class="slide-counter">01 / 20</span>
<button id="nextBtn" class="btn btn-outline" type="button">Tiếp &#8594;</button>
<div class="divider"></div>
<button id="fullscreenBtn" class="btn btn-slideshow" type="button">▶ Trình chiếu</button>
</div>
</header>
<main class="stage-wrapper">
<div id="presentationStage" class="slide-stage">
<div id="MorphMediaFrame" class="morph-media-frame">
<div id="slideBgImage" class="slide-bg-image"></div>
<canvas id="videoEffectCanvas" class="video-effect-canvas"></canvas>
<div id="scenicGradientMask" class="scenic-gradient-mask"></div>
</div>
<div id="MorphRedTimelineLine" class="morph-timeline-line"></div>
<div id="MorphRedFocusPin" class="morph-focus-pin">
<span class="pin-core"></span><span class="pin-pulse"></span><span id="pinLabel" class="pin-label">1911 • Khởi hành</span>
</div>
<section id="slideContentLayer" class="slide-content-layer"></section>
<div id="laserPointerDot" class="laser-pointer-dot"></div>
<div class="ppt-laser-controls">
<button id="fsPrevBtn" type="button">&#10094;</button><span id="fsSlideIndicator">01 / 20</span>
<button id="fsNextBtn" type="button">&#10095;</button><button id="fsExitBtn" type="button">✕ Thoát</button>
</div>
<div class="morph-hud"><span class="hud-tag">Morph Presentation</span></div>
<div id="endShowOverlay" class="end-show-overlay hidden">
<div class="end-show-box">
<div class="end-badge">HOÀN THÀNH 20 SLIDE</div>
<h2 class="end-title">KẾT THÚC BÀI THUYẾT TRÌNH</h2>
<p class="end-desc">Cảm ơn Cô và các bạn đã lắng nghe!</p>
<div class="end-actions">
<button id="backToSlide20Btn" class="btn btn-outline" type="button">Quay lại Slide 20</button>
<button id="restartShowBtn" class="btn btn-primary" type="button">Xem lại từ đầu</button>
<button id="exitEndShowBtn" class="btn btn-secondary" type="button">Thoát</button>
</div>
</div>
</div>
</div>
</main>
<footer class="thumbnail-strip" id="thumbnailStrip"></footer>
<script src="script.js"></script>
</body>
</html>
